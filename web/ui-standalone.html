<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NapkinWire - UI Mockup Tool (Standalone)</title>
    <script>
        (function () {
            var t = 'dark';
            try {
                t = localStorage.getItem('nw-theme')
                    || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            } catch (e) { /* storage unavailable */ }
            document.documentElement.dataset.theme = t;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', t === 'light' ? '#f2f6f9' : '#1a1833');
        })();
    </script>
    <meta name="theme-color" content="#1a1833">
    <style>
        @font-face {
            font-family: 'Lexend';
            font-style: normal;
            font-display: swap;
            font-weight: 100 900;
            src: url('fonts/lexend-latin-wght-normal.woff2') format('woff2');
        }

        @font-face {
            font-family: 'Iosevka Mono';
            font-style: normal;
            font-display: swap;
            font-weight: 400;
            src: url('fonts/iosevka-latin-400-normal.woff2') format('woff2');
        }

        /* Dark theme (default) — indigo base #3F3B6C, mauve #9F73AB, steel #A3C7D6 */
        :root {
            color-scheme: dark;
            --fg: #a3c7d6;
            --bg: #1a1833;
            --muted: #9f73ab;
            --button_fg: #1a1833;
            --button_bg: #a3c7d6;
            --button_bg_clicked: #b8d4e1;
            --secondary_bg: #9f73ab;
            --secondary_fg: #1a1833;
            --secondary_bg_clicked: #ab83b8;
            --border: #3a3663;
            --input-border: #7b75b8;
            --palette-bg: #2b2850;
            --palette-active-bg: #3a3663;
            --palette-fg: #d8d2e4;
            --canvas-bg: #201d3e;
            --input-bg: #23204a;
            --input-fg: #a3c7d6;
            --ascii-bg: #131126;
            --focus: #a3c7d6;
            --ok: #a7e8c6;
            --danger: #f6b3ac;
        }

        /* Light theme — same hues, flipped lightness */
        :root[data-theme="light"] {
            color-scheme: light;
            --fg: #1c1839;
            --bg: #f2f6f9;
            --muted: #5a5370;
            --button_fg: #ffffff;
            --button_bg: #3f3b6c;
            --button_bg_clicked: #322e5b;
            --secondary_bg: #a87fb6;
            --secondary_fg: #1c1839;
            --secondary_bg_clicked: #a176b2;
            --border: #c9c3da;
            --input-border: #624f82;
            --palette-bg: #e7e3ef;
            --palette-active-bg: #d8d3e4;
            --palette-fg: #241f44;
            --canvas-bg: #ffffff;
            --input-bg: #ffffff;
            --input-fg: #1c1839;
            --ascii-bg: #edeaf4;
            --focus: #624f82;
            --ok: #17703c;
            --danger: #b3261e;
        }

        * {
            box-sizing: border-box;
        }

        :focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Lexend', sans-serif;
        }

        header {
            padding: 0.5rem 1rem;
            border-bottom: 2px solid var(--border);
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            margin-right: 2%;
            display: inline-block;
        }

        .tagline {
            margin: 0.2rem 0 0 0;
            margin-top: auto;
            font-style: italic;
            color: var(--muted);
            display: inline-block;
        }

        .header-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            padding: 0;
            display: grid;
            place-items: center;
            background: var(--palette-bg);
            color: var(--palette-fg);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
        }

        .theme-toggle:hover {
            background: var(--palette-active-bg);
        }

        .theme-toggle .icon-moon {
            display: none;
        }

        [data-theme="light"] .theme-toggle .icon-sun {
            display: none;
        }

        [data-theme="light"] .theme-toggle .icon-moon {
            display: block;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 70px);
            gap: 1rem;
            padding: 1rem;
        }
        .drawing-section {
            flex: 1;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
            align-items: center;
        }

        .layout-select {
            padding: 0.5rem;
            border: 2px solid var(--input-border);
            border-radius: 4px;
            background: var(--input-bg);
            color: var(--input-fg);
            font-family: inherit;
        }

        .color-palette {
            display: flex;
            gap: 0.25rem;
            flex-wrap: wrap;
        }

        .color-btn {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            cursor: pointer;
            background: var(--palette-bg);
            color: var(--palette-fg);
            border-radius: 6px;
            font-family: inherit;
        }

        .color-btn::before {
            content: '●';
            font-size: 16px;
            margin-right: 0.5rem;
        }

        .color-btn.red::before {
            color: #ff0000;
        }

        .color-btn.green::before {
            color: #00ff00;
        }

        .color-btn.blue::before {
            color: #4d8eff;
        }

        .color-btn.yellow::before {
            color: #DAA520;
        }

        .color-btn.purple::before {
            color: #ff00ff;
        }

        .color-btn.active {
            border: 2px solid var(--palette-fg);
            background: var(--palette-active-bg);
        }

        .action-btn {
            padding: 0.5rem 1rem;
            background-color: var(--secondary_bg);
            color: var(--secondary_fg);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }

        .action-btn:hover {
            background-color: var(--secondary_bg_clicked);
        }

        canvas {
            width: 100%;
            max-width: 800px;
            background-color: var(--canvas-bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }

        .output-section {
            flex: 1;
        }

        .context-display {
            background: var(--input-bg);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid var(--border);
        }

        .context-display h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
        }

        .context-display p {
            margin: 0;
            font-style: italic;
            color: var(--muted);
        }

        .ascii-display {
            font-family: 'Iosevka Mono', monospace;
            font-size: 10px;
            background-color: var(--ascii-bg);
            color: var(--input-fg);
            border: 2px solid var(--border);
            padding: 1rem;
            white-space: pre;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .input-group label {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .input-group input,
        .input-group textarea {
            padding: 0.75rem;
            border: 2px solid var(--input-border);
            border-radius: 4px;
            font-size: 1rem;
            font-family: inherit;
            background-color: var(--input-bg);
            color: var(--input-fg);
        }

        .input-group textarea {
            resize: vertical;
        }

        .text-areas {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .text-areas > div {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .text-areas label {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .text-areas input {
            padding: 0.5rem;
            border: 2px solid var(--input-border);
            border-radius: 4px;
            background-color: var(--input-bg);
            color: var(--input-fg);
            font-family: inherit;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--button_bg);
        }

        .primary-btn {
            padding: 1rem 2rem;
            background-color: var(--button_bg);
            color: var(--button_fg);
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: inherit;
        }

        .primary-btn:hover {
            background-color: var(--button_bg_clicked);
        }

        .result-area {
            margin-top: 20px;
        }

        .result-area textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 4px;
            resize: vertical;
            background-color: var(--input-bg);
            color: var(--input-fg);
        }

        @media (min-width: 768px) {
            .app-container {
                flex-direction: row;
                gap: 2rem;
                padding: 2rem;
            }

            .drawing-section {
                flex: 1;
                max-width: 50%;
            }

            .output-section {
                flex: 1;
                max-width: 50%;
            }

            .controls {
                justify-content: flex-start;
            }

            .ascii-display {
                max-height: 400px;
                font-size: 11px;
            }

            canvas {
                max-width: 100%;
            }
        }

        @media (min-width: 1200px) {
            .app-container {
                max-width: 1400px;
                margin: 0 auto;
                padding: 2rem;
            }

            .ascii-display {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>NapkinWire</h1>
            <p class="tagline">Standalone UI Mockup Tool</p>
        </div>

        <div class="header-actions">
            <button id="theme-toggle" class="theme-toggle" type="button"
                aria-pressed="true" aria-label="Toggle dark theme">
                <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z" />
                </svg>
                <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path
                        d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
                </svg>
            </button>
        </div>
    </header>

    <main class="app-container">
        <!-- Left side: Drawing -->
        <section class="drawing-section">
            <div class="context-display">
                <h3>Context:</h3>
                <p id="contextText">Loading context...</p>
                <h3>Focus:</h3>
                <p id="focusText">Loading focus...</p>
            </div>

            <div class="controls">
                <select title="Pick Layout" id="layoutPicker" class="layout-select">
                    <option value="desktop">Desktop (16:9)</option>
                    <option value="mobile">Mobile (9:16)</option>
                    <option value="square">Square (1:1)</option>
                </select>

                <div class="color-palette">
                    <button data-color="#ff0000" class="color-btn red">Red</button>
                    <button data-color="#00ff00" class="color-btn green">Green</button>
                    <button data-color="#4d8eff" class="color-btn blue">Blue</button>
                    <button data-color="#DAA520" class="color-btn yellow">Yellow</button>
                    <button data-color="#ff00ff" class="color-btn purple">[TEXT]</button>
                    <button id="undoBtn" class="action-btn">Undo</button>
                    <button id="clear_canvas" class="action-btn">Clear</button>
                </div>
            </div>

            <canvas id="drawingCanvas" width="800" height="450"></canvas>
        </section>

        <!-- Right side: ASCII + Inputs -->
        <section class="output-section">
            <div id="ascii-preview" class="ascii-display"></div>

            <div class="input-section">
                <div class="input-group">
                    <label for="overall-purpose">What are you building?</label>
                    <input type="text" id="overall-purpose" placeholder="Dashboard, blog, chat app...">
                </div>

                <div class="input-group">
                    <label for="platform">Framework/Language</label>
                    <input type="text" id="platform" placeholder="React, Vue, Python...">
                </div>

                <div id="rectangle-dropdowns" class="text-areas">
                    <!-- Text area inputs generated here -->
                </div>

                <div class="input-group">
                    <label for="additional-notes">Additional Notes (optional)</label>
                    <textarea id="additional-notes" rows="3" placeholder="e.g., Dark theme, mobile-first, carousel auto-advance, use Tailwind CSS..."></textarea>
                </div>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="tuiMode">
                        Terminal UI instead of GUI
                    </label>
                </div>

                <button id="get_prompt" class="primary-btn">Generate Prompt</button>
                
                <div class="result-area">
                    <h3>Generated Prompt:</h3>
                    <textarea id="resultText" readonly placeholder="Draw your mockup and click 'Generate Prompt'"></textarea>
                    <button id="saveResult" class="primary-btn" style="margin-top: 10px;">Save & Return to Claude</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Theme toggle: <html data-theme> is pre-set by an inline head script; sync
        // control state and swap the browser chrome color on click.
        const themeToggle = document.getElementById('theme-toggle');
        const THEME_COLORS = { dark: '#1a1833', light: '#f2f6f9' };

        function syncThemeControl(theme) {
            if (themeToggle) {
                themeToggle.setAttribute('aria-pressed', String(theme === 'dark'));
            }
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', THEME_COLORS[theme]);
        }

        if (themeToggle) {
            syncThemeControl(document.documentElement.dataset.theme || 'dark');
            themeToggle.addEventListener('click', () => {
                const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
                document.documentElement.dataset.theme = next;
                try {
                    localStorage.setItem('nw-theme', next);
                } catch (e) { /* storage unavailable, theme still applies */ }
                syncThemeControl(next);
            });
        }

        // Constants and variables
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const snapSize = isTouchDevice ? 15 : 10;

        const uiColorMapping = {
            '#ff0000': '#',  // Red
            '#00ff00': '@',  // Green  
            '#4d8eff': '%',  // Blue
            '#DAA520': '&',  // Yellow
            '#ff00ff': '.'   // Purple
        };

        let rectangles = [];
        let isDrawing = false;
        let startX, startY;
        let currentColor = '#ff0000';

        // Utility functions
        function snapToGrid(coord, snapSize) {
            return Math.floor(coord / snapSize) * snapSize;
        }

        function getMousePos(e, canvas, snapSize) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            return {
                x: snapToGrid(x, snapSize),
                y: snapToGrid(y, snapSize)
            };
        }

        function getTouchPos(e, canvas, snapSize) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const touch = e.touches[0];
            const x = (touch.clientX - rect.left) * scaleX;
            const y = (touch.clientY - rect.top) * scaleY;

            return {
                x: snapToGrid(x, snapSize),
                y: snapToGrid(y, snapSize)
            };
        }

        function redrawCanvas(ctx, shapes) {
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            shapes.forEach(shape => {
                if (shape.type === 'rectangle') {
                    if (shape.color === '#ff00ff') {
                        ctx.fillStyle = shape.color;
                        ctx.fillRect(shape.x, shape.y, shape.width, shape.height);
                    } else {
                        ctx.strokeStyle = shape.color;
                        ctx.lineWidth = 2;
                        ctx.strokeRect(shape.x, shape.y, shape.width, shape.height);
                    }
                }
            });
        }

        function isOnPerimeter(x, y, shape, snapSize) {
            const pixelX = x * snapSize;
            const pixelY = y * snapSize;

            if (shape.type === 'rectangle') {
                const onLeftOrRight = (pixelX === shape.x || pixelX === shape.x + shape.width - snapSize) &&
                    (pixelY >= shape.y && pixelY <= shape.y + shape.height - snapSize);
                const onTopOrBottom = (pixelY === shape.y || pixelY === shape.y + shape.height - snapSize) &&
                    (pixelX >= shape.x && pixelX <= shape.x + shape.width - snapSize);

                return onLeftOrRight || onTopOrBottom;
            }
            return false;
        }

        function generateASCII(shapes, canvasWidth, canvasHeight, snapSize, colorMapping) {
            const gridWidth = Math.floor(canvasWidth / snapSize);
            const gridHeight = Math.floor(canvasHeight / snapSize);
            let asciiOutput = '';

            let textAreaCounter = 1;
            const textAreaNumbers = new Map();

            shapes.forEach((shape, index) => {
                if (shape.color === '#ff00ff') {
                    textAreaNumbers.set(index, textAreaCounter++);
                }
            });

            for (let y = 0; y < gridHeight; y++) {
                let row = '';
                for (let x = 0; x < gridWidth; x++) {
                    let char = ' ';

                    for (let shapeIndex = 0; shapeIndex < shapes.length; shapeIndex++) {
                        const shape = shapes[shapeIndex];

                        if (isOnPerimeter(x, y, shape, snapSize)) {
                            if (shape.color === '#ff00ff') {
                                char = textAreaNumbers.get(shapeIndex).toString();
                            } else {
                                char = colorMapping[shape.color] || '?';
                            }
                            break;
                        }
                    }
                    row += char;
                }
                asciiOutput += row + '\\n';
            }

            return asciiOutput;
        }

        function generateInputFields(shapes, container) {
            container.innerHTML = '';

            const placeholderText = "e.g., Article title, User message, Navigation links";
            let textAreaCounter = 1;

            shapes.forEach((shape, index) => {
                if (shape.color === '#ff00ff') {
                    const fieldDiv = document.createElement('div');
                    fieldDiv.innerHTML = `
                        <label>Text Area ${textAreaCounter}:</label>
                        <input type="text" id="text_${index}" placeholder="${placeholderText}">
                    `;
                    container.appendChild(fieldDiv);
                    textAreaCounter++;
                }
            });
        }

        function updateLayout(shapes, canvasWidth, canvasHeight, snapSize, colorMapping, asciiElement, inputContainer) {
            const asciiOutput = generateASCII(shapes, canvasWidth, canvasHeight, snapSize, colorMapping);
            asciiElement.textContent = asciiOutput;
            generateInputFields(shapes, inputContainer);
        }

        function generateAnnotatedASCII(asciiLayout, shapes, inputContainer) {
            let textAreaDescriptions = '';
            let textAreaCounter = 1;

            shapes.forEach((shape, index) => {
                if (shape.color === '#ff00ff') {
                    const textInput = inputContainer.querySelector(`#text_${index}`);
                    const description = textInput ? textInput.value : 'text content';
                    textAreaDescriptions += `\\nText Area ${textAreaCounter}: ${description}`;
                    textAreaCounter++;
                }
            });

            return `${asciiLayout}\\n\\nContent areas:${textAreaDescriptions}`;
        }

        function generateUIPrompt() {
            const asciiArt = generateASCII(rectangles, canvas.width, canvas.height, snapSize, uiColorMapping);
            const annotatedASCII = generateAnnotatedASCII(
                asciiArt,
                rectangles, 
                document.getElementById('rectangle-dropdowns')
            );
            
            const overallPurpose = document.getElementById('overall-purpose').value || 'web interface';
            const platform = document.getElementById('platform').value || 'vanilla JS';
            const isTUI = document.getElementById("tuiMode").checked;

            let createStatement = '';
            if (isTUI) {
                createStatement = `Create this TUI (Terminal User Interface) using ${platform}`;
            } else {
                createStatement = `Create this GUI using ${platform}`;
            }

            let finalPrompt = `${createStatement}, it will be used for a ${overallPurpose}

${annotatedASCII}

Please create a functional interface that matches this layout exactly. Use the visual structure shown in the ASCII art as your guide for positioning and proportions.`;

            const additionalNotes = document.getElementById('additional-notes').value;
            if (additionalNotes) {
                finalPrompt += `\\n\\nAdditional requirements: \\n\\n${additionalNotes}`;
            }

            return finalPrompt;
        }

        // Load context from temp file (simplified for browser limitations)
        async function loadContext() {
            try {
                // In a real implementation, this would need to read from the temp file
                // For now, we'll show placeholder text
                document.getElementById('contextText').textContent = 'Context will be loaded from temp file';
                document.getElementById('focusText').textContent = 'Focus will be loaded from temp file';
            } catch (error) {
                console.error('Failed to load context:', error);
                document.getElementById('contextText').textContent = 'Failed to load context';
                document.getElementById('focusText').textContent = 'Failed to load focus';
            }
        }

        // Event listeners
        let currentLayout = 'desktop';

        function setCanvasLayout(layout) {
            currentLayout = layout;
            applyCanvasSize(layout);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            rectangles = [];
        }

        function applyCanvasSize(layout) {
            switch (layout) {
                case 'desktop':
                    canvas.width = 800;
                    canvas.height = 450;
                    canvas.style.width = '';
                    canvas.style.maxHeight = '';
                    break;
                case 'mobile':
                case 'square': {
                    // Fit canvas height to available viewport space
                    const availH = window.innerHeight - canvas.getBoundingClientRect().top - 20;
                    const h = Math.max(snapSize * 10, Math.floor(availH / snapSize) * snapSize);
                    const ratio = layout === 'mobile' ? 9 / 16 : 1;
                    canvas.height = h;
                    canvas.width = Math.max(snapSize, Math.floor((h * ratio) / snapSize) * snapSize);
                    canvas.style.width = 'auto';
                    canvas.style.maxHeight = h + 'px';
                    break;
                }
            }
        }

        document.getElementById('layoutPicker').addEventListener('change', function (e) {
            setCanvasLayout(e.target.value);
        });

        window.addEventListener('resize', function () {
            if (currentLayout !== 'desktop') {
                const oldW = canvas.width;
                const oldH = canvas.height;
                applyCanvasSize(currentLayout);
                // Remap existing rectangles to the new canvas size so they stay on-grid
                // and remain consistent with the regenerated ASCII preview.
                rectangles = rectangles.map(shape => ({
                    ...shape,
                    x: snapToGrid(shape.x * (canvas.width / oldW), snapSize),
                    y: snapToGrid(shape.y * (canvas.height / oldH), snapSize),
                    width: Math.max(snapSize, Math.round(shape.width * (canvas.width / oldW))),
                    height: Math.max(snapSize, Math.round(shape.height * (canvas.height / oldH)))
                }));
                redrawCanvas(ctx, rectangles);
                updateLayout(rectangles, canvas.width, canvas.height, snapSize, uiColorMapping,
                    document.getElementById('ascii-preview'), document.getElementById('rectangle-dropdowns'));
            }
        });

        // Set initial active state
        document.querySelector('.color-btn[data-color="#ff0000"]').classList.add('active');

        // Handle color button clicks
        document.querySelectorAll('.color-btn').forEach(button => {
            button.addEventListener('click', function () {
                document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                currentColor = this.dataset.color;
            });
        });

        // Mouse events
        canvas.addEventListener('mousedown', function (e) {
            const pos = getMousePos(e, canvas, snapSize);
            isDrawing = true;
            startX = pos.x;
            startY = pos.y;
        });

        document.addEventListener('mouseup', function (e) {
            if (!isDrawing) return;

            const pos = getMousePos(e, canvas, snapSize);
            const width = pos.x - startX;
            const height = pos.y - startY;

            if (Math.abs(width) >= snapSize && Math.abs(height) >= snapSize) {
                rectangles.push({
                    x: Math.min(startX, pos.x),
                    y: Math.min(startY, pos.y),
                    width: Math.abs(width),
                    height: Math.abs(height),
                    color: currentColor,
                    type: "rectangle"
                });

                updateLayout(rectangles, canvas.width, canvas.height, snapSize, uiColorMapping, 
                    document.getElementById('ascii-preview'), document.getElementById('rectangle-dropdowns'));
            }

            isDrawing = false;
            redrawCanvas(ctx, rectangles);
        });

        document.addEventListener('mousemove', function (e) {
            if (!isDrawing) return;

            const pos = getMousePos(e, canvas, snapSize);
            const width = pos.x - startX;
            const height = pos.y - startY;

            redrawCanvas(ctx, rectangles);

            const px = Math.min(startX, pos.x);
            const py = Math.min(startY, pos.y);
            const pw = Math.abs(width);
            const ph = Math.abs(height);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = 2;
            if (currentColor === '#ff00ff') {
                ctx.fillStyle = currentColor;
                ctx.fillRect(px, py, pw, ph);
            } else {
                ctx.strokeRect(px, py, pw, ph);
            }
        });

        // Touch events
        canvas.addEventListener('touchstart', function (e) {
            e.preventDefault();
            const pos = getTouchPos(e, canvas, snapSize);
            isDrawing = true;
            startX = pos.x;
            startY = pos.y;
        });

        document.addEventListener('touchmove', function (e) {
            if (!isDrawing) return;
            e.preventDefault();

            const pos = getTouchPos(e, canvas, snapSize);
            const width = pos.x - startX;
            const height = pos.y - startY;

            redrawCanvas(ctx, rectangles);

            const px = Math.min(startX, pos.x);
            const py = Math.min(startY, pos.y);
            const pw = Math.abs(width);
            const ph = Math.abs(height);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = 2;
            if (currentColor === '#ff00ff') {
                ctx.fillStyle = currentColor;
                ctx.fillRect(px, py, pw, ph);
            } else {
                ctx.strokeRect(px, py, pw, ph);
            }
        });

        document.addEventListener('touchend', function (e) {
            if (!isDrawing) return;
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const touch = e.changedTouches[0];
            const x = (touch.clientX - rect.left) * scaleX;
            const y = (touch.clientY - rect.top) * scaleY;

            const pos = { x: snapToGrid(x, snapSize), y: snapToGrid(y, snapSize) };
            const width = pos.x - startX;
            const height = pos.y - startY;

            if (Math.abs(width) >= snapSize && Math.abs(height) >= snapSize) {
                rectangles.push({
                    x: Math.min(startX, pos.x),
                    y: Math.min(startY, pos.y),
                    width: Math.abs(width),
                    height: Math.abs(height),
                    color: currentColor,
                    type: "rectangle"
                });

                updateLayout(rectangles, canvas.width, canvas.height, snapSize, uiColorMapping, 
                    document.getElementById('ascii-preview'), document.getElementById('rectangle-dropdowns'));
            }

            isDrawing = false;
            redrawCanvas(ctx, rectangles);
        });

        // Button event listeners
        document.getElementById('undoBtn').addEventListener('click', function() {
            if (rectangles.length > 0) {
                rectangles.pop();
                redrawCanvas(ctx, rectangles);
                updateLayout(rectangles, canvas.width, canvas.height, snapSize, uiColorMapping, 
                    document.getElementById('ascii-preview'), document.getElementById('rectangle-dropdowns'));
            }
        });

        document.getElementById("clear_canvas").addEventListener('click', function () {
            rectangles = [];
            redrawCanvas(ctx, rectangles);
            document.getElementById('ascii-preview').textContent = '';
            document.getElementById('rectangle-dropdowns').innerHTML = '';
            document.getElementById('overall-purpose').value = '';
            document.getElementById('platform').value = '';
            document.getElementById('additional-notes').value = '';
            document.getElementById('tuiMode').checked = false;
            document.getElementById('resultText').value = '';

            const originalText = this.textContent;
            this.textContent = 'Cleared!';
            setTimeout(() => {
                this.textContent = originalText;
            }, 800);
        });

        document.getElementById("get_prompt").addEventListener('click', function () {
            const finalPrompt = generateUIPrompt();
            document.getElementById('resultText').value = finalPrompt;

            const originalText = this.textContent;
            this.textContent = 'Prompt Generated!';
            this.style.backgroundColor = 'var(--ok)';

            setTimeout(() => {
                this.textContent = originalText;
                this.style.backgroundColor = 'var(--button_bg)';
            }, 1500);
        });

        document.getElementById('saveResult').addEventListener('click', function() {
            const result = document.getElementById('resultText').value;
            if (result) {
                // In a real implementation, this would write to the temp file
                // For now, just copy to clipboard as fallback
                navigator.clipboard.writeText(result).then(() => {
                    this.textContent = 'Copied to Clipboard!';
                    this.style.backgroundColor = 'var(--ok)';
                    setTimeout(() => {
                        this.textContent = 'Save & Return to Claude';
                        this.style.backgroundColor = 'var(--button_bg)';
                    }, 2000);
                }).catch(() => {
                    alert('Result ready! Copy the text manually and return to Claude.');
                });
            } else {
                alert('Please generate a prompt first!');
            }
        });

        // Initialize
        loadContext();
    </script>
</body>
</html>
